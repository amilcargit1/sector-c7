<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sector C7 — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="coord">42.6°N — 71.1°W</div>
    <div class="mark">SECTOR&nbsp;C-7</div>
    <div class="status"><a href="index.html">volver</a></div>
  </header>

  <main class="auth-wrap">
    <h1>Entrar</h1>
    <p class="hero-sub">Acceso de integrantes del equipo.</p>
    <form class="auth-form" id="login-form">
      <div>
        <label for="username">Usuario</label>
        <input id="username" name="username" required autocomplete="username" />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <p class="auth-msg" id="msg"></p>
      <button type="submit">Entrar</button>
    </form>
    <p class="auth-switch">¿Todavía no tienes cuenta? <a href="register.html">Regístrate</a></p>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || "No se pudo entrar";
        return;
      }
      window.location.href = "admin.html";
    });
  </script>
</body>
</html>
